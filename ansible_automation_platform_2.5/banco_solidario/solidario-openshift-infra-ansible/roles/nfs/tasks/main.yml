---
- name: Install NFS
  yum:
    name: nfs-utils
    state: present
  become: true

- name: Enable nfs on firewalld
  firewalld:
    service: nfs
    permanent: yes
    immediate: yes
    state: enabled
  become: true

- name: Start nfs-server
  service:
    name: nfs-server
    enabled: yes
    state: started
  become: true

- name: Create NFS /data/exports directory
  file:
    path: /var/exports
    state: directory
    mode: '0770'
    owner: root
    group: root
  become: true

- name: Copy NFS export conf file
  template:
    src: openshift.exports.j2
    dest: /etc/exports.d/openshift.exports
  notify: restart nfs
  become: true
