ansible_connection: winrm
ansible_port: 5985
ansible_winrm_server_cert_validation: ignore
ansible_winrm_transport: ntlm

ansible_user: "AD\\Administrator"
ansible_password: RedHat1!


win_domain_admin_user: Administrator
